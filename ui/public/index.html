<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ASI Database Console</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
      }
      main {
        max-width: 960px;
        margin: 48px auto;
        padding: 24px;
      }
      .card {
        background: #111827;
        border: 1px solid #334155;
        border-radius: 12px;
        padding: 24px;
        box-shadow: 0 8px 24px rgba(15, 23, 42, 0.45);
      }
      button {
        background: #2563eb;
        color: white;
        border: none;
        padding: 10px 16px;
        border-radius: 8px;
        cursor: pointer;
      }
      input,
      select {
        display: block;
        width: 100%;
        box-sizing: border-box;
        margin: 8px 0 16px;
        padding: 10px;
        border: 1px solid #475569;
        border-radius: 6px;
      }
      label {
        display: block;
      }
      code {
        font-size: 0.9rem;
        color: #93c5fd;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <h1>ASI Database Console</h1>
        <p>Tenant usage and database operation quota preview.</p>
        <form id="loginForm">
          <label for="username">Username</label>
          <input id="username" name="username" autocomplete="username" required />
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
          <button type="submit">Sign in</button>
        </form>
        <button id="logoutButton" type="button" hidden>Sign out</button>
        <label for="tenantSelect">Tenant</label>
        <select id="tenantSelect" disabled></select>
        <button id="refreshButton" type="button" disabled>Refresh usage</button>
        <p id="status" role="status" aria-live="polite">Checking API health…</p>
        <section id="usagePanel" aria-live="polite"></section>
      </div>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
